services:
  whisper:
    build:
      context: .
      dockerfile: docker/whisper/Dockerfile
    ports:
      - "8080:8080"
    environment:
      WHISPER_MODEL: base.en
      WHISPER_PORT: 8080
    volumes:
      - whisper_models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: npm run db:migrate --workspace=@quick-capture/api
    env_file:
      - .env
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: npm run dev --workspace=@quick-capture/api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      TRANSCRIPTION_PROVIDER: whisper-cpp
      WHISPER_CPP_BASE_URL: http://whisper:8080
      WHISPER_CPP_INFERENCE_PATH: /inference
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - api_uploads:/app/apps/api/.uploads
    depends_on:
      whisper:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: npm run dev:docker --workspace=@quick-capture/web
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
      - ./apps/web/certificates:/app/apps/web/certificates:ro
    depends_on:
      - api

volumes:
  whisper_models:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  shared_node_modules:
  api_uploads:
