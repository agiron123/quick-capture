# TLS reverse proxy — use with:
# docker compose -f docker-compose.yml -f docker-compose.tls.yml --profile tls up
#
# Requires DEV_DOMAIN and ACME_EMAIL in .env (see docs/features/deployment.md)

services:
  api:
    ports: !override []
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS}

  web:
    ports: !override []
    command: npm run dev:docker:http --workspace=@quick-capture/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

  whisper:
    ports: !override []

  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  caddy_data:
  caddy_config:
